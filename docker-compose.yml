version: "3.9"

services:

  gateway:
    build: .
    container_name: api_gateway

    ports:
      - "8000:8000"

    environment:
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:8
    container_name: mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: